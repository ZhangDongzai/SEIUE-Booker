<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>希悦自动订场</title>
<style>
  :root {
    --bg: #f2f4f7; --card: #ffffff; --line: #e3e7ee; --text: #1a1d21;
    --muted: #6b7480; --ok: #12a05c; --warn: #d98324; --err: #d64545; --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131519; --card: #1c1f25; --line: #2a2f38; --text: #e7eaef;
      --muted: #98a1ae; --ok: #35c47f; --warn: #e0a45a; --err: #f0736f; --accent: #6ea8fe;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px 14px calc(20px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .ver { color: var(--muted); font-size: 12px; text-align: right; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .state { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  .dot.warn { background: var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; margin-top: 12px; }
  .kv .k { color: var(--muted); font-size: 12px; }
  .kv .v { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto; min-width: 92px; padding: 10px 14px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-size: 14px; font-weight: 500;
  }
  button:active { transform: scale(.985); }
  button:disabled { opacity: .45; }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  button.danger { color: var(--err); }
  button.ghost { background: transparent; }
  .log {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px; margin: 0; color: var(--muted);
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .banner {
    border-radius: 10px; padding: 11px 12px; font-size: 13px; line-height: 1.6;
    border: 1px solid var(--line); background: var(--card);
  }
  .banner.err { border-color: var(--err); }
  .banner.warn { border-color: var(--warn); }
  .banner b { color: var(--text); }
  .sec-title { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #222831ee; color: #fff; padding: 9px 16px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9;
  }
  .toast.show { opacity: 1; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>

<div class="head">
  <h1>希悦自动订场</h1>
  <span class="ver" id="ver">KernelSU 模块</span>
</div>

<div class="card">
  <div class="state"><span class="dot" id="dot"></span><span id="stateText">读取中…</span></div>
  <div class="grid">
    <div class="kv"><div class="k">端口</div><div class="v" id="vPort">—</div></div>
    <div class="kv"><div class="k">PID</div><div class="v" id="vPid">—</div></div>
    <div class="kv"><div class="k">健康检查</div><div class="v" id="vHttp">—</div></div>
    <div class="kv"><div class="k">运行时</div><div class="v" id="vPy">—</div></div>
  </div>
  <div class="hint" id="vData">数据目录 —</div>
</div>

<div class="card">
  <button class="primary" id="btnOpen" style="width:100%;margin-bottom:8px">在本页打开界面</button>
  <div class="row">
    <button id="btnStart">启动</button>
    <button id="btnStop" class="danger">停止</button>
    <button id="btnRestart">重启</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="ghost" id="btnProbe">检测健康</button>
    <button class="ghost" id="btnDeps">安装依赖</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="ghost" id="btnSelf">环境自检</button>
    <button class="ghost" id="btnDiag">完整诊断</button>
    <button class="ghost" id="btnLog">运行日志</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="ghost" id="btnRefresh">刷新状态</button>
  </div>
  <div class="hint" id="openHint" style="display:none"></div>
</div>

<div id="bannerBox"></div>

<div class="card" id="frameCard" style="display:none;padding:0;overflow:hidden">
  <div class="row" style="padding:8px 10px 6px">
    <button class="ghost" id="btnReloadFrame"
            style="flex:0 0 auto;min-width:0;padding:6px 12px;font-size:13px">刷新</button>
    <button class="ghost" id="btnBrowser"
            style="flex:0 0 auto;min-width:0;padding:6px 12px;font-size:13px">用浏览器打开</button>
    <span class="hint" id="frameHint" style="margin:0;align-self:center">加载较慢时可点「刷新」</span>
  </div>
  <iframe id="appFrame" src="about:blank" title="完整界面"
          style="width:100%;height:72vh;border:0;display:block;background:#fff"></iframe>
</div>

<div class="card">
  <p class="sec-title">输出</p>
  <pre class="log" id="log">点「环境自检」可以一次看清脚本路径、权限、Python 与进程状态。</pre>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var MODULE_ID = "badminton_booker";
  var ctlPath = null;       // 已定位到的 ctl.sh 绝对路径
  var execReady = null;     // 可用的 exec 变体名
  var execInfo = "";        // 供界面显示的 exec 探测结论
  var probing = null;
  var BUSY = false;

  function $(id) { return document.getElementById(id); }

  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  function showBanner(html, kind) {
    $("bannerBox").innerHTML = html
      ? ('<div class="card" style="padding:0"><div class="banner ' + (kind || "err") + '">' + html + "</div></div>")
      : "";
  }

  /* ==========================================================================
   * exec 兼容层
   *
   * KernelSU 官方 / KernelSU Next / SukiSU / APatch 的 WebUI 桥接并不统一：
   *   · 参数：exec(cmd) / exec(cmd, cb) / exec(cmd, opts, cb)
   *   · opts：有的是对象 {cwd,env,uid,gid}，有的要 JSON 字符串
   *   · 回调：有的是 (errno, stdout, stderr) 三个参数，
   *           有的只回一个 JSON 字符串 {"errno":0,"stdout":"...","stderr":"..."}
   *           有的根本不回调，只返回 Promise
   * 猜错一次回调就永远不来 → 页面全部「超时」，报「找不到控制脚本」。
   * 所以这里不猜：把每种组合都试一遍，用一个 echo 标记探出能用的那个，之后固定使用。
   * ====================================================================== */

  /* ---- 官方实现（照抄 npm 包 kernelsu@3.x 的 index.js 契约） ----
     window[name] = (errno, stdout, stderr) => {...}
     ksu.exec(command, JSON.stringify(options), name)     ← 第三参数是「函数名字符串」
     传函数对象的话，原生拿不到回调名，就永远不会回调——这正是之前全部超时的原因。 */
  var cbSeq = 0;

  function officialExec(k, cmd) {
    return new Promise(function (resolve) {
      var name = "__booker_cb_" + Date.now() + "_" + (cbSeq++);
      window[name] = function (a, b, c) {
        try { delete window[name]; } catch (e) { /* ignore */ }
        resolve(normalize(a, b, c));
      };
      try {
        k.exec(cmd, "{}", name);
      } catch (e) {
        try { delete window[name]; } catch (e2) { /* ignore */ }
        throw e;                       // 由 callVariant 的 try/catch 接住
      }
    });
  }

  /* spawn 同样是「名字字符串」：把子进程对象挂在 window[name] 上，
     原生通过 child.stdout.emit("data", chunk) / child.emit("exit", code) 回调。 */
  function officialSpawn(k, cmd) {
    return new Promise(function (resolve) {
      if (typeof k.spawn !== "function") throw new Error("没有 spawn 接口");

      var name = "__booker_child_" + Date.now() + "_" + (cbSeq++);
      var out = "", err = "";

      function makeStdio() {
        var self = { listeners: {} };
        self.on = function (ev, fn) { (self.listeners[ev] = self.listeners[ev] || []).push(fn); };
        self.emit = function (ev) {
          var args = Array.prototype.slice.call(arguments, 1);
          (self.listeners[ev] || []).forEach(function (fn) { fn.apply(null, args); });
        };
        return self;
      }

      var child = { listeners: {}, stdout: makeStdio(), stderr: makeStdio(), stdin: makeStdio() };
      child.on = function (ev, fn) { (child.listeners[ev] = child.listeners[ev] || []).push(fn); };
      child.emit = function (ev) {
        var args = Array.prototype.slice.call(arguments, 1);
        (child.listeners[ev] || []).forEach(function (fn) { fn.apply(null, args); });
      };

      child.stdout.on("data", function (d) { out += d; });
      child.stderr.on("data", function (d) { err += d; });
      child.on("exit", function (code) {
        try { delete window[name]; } catch (e) { /* ignore */ }
        resolve({ errno: code | 0, stdout: out, stderr: err });
      });
      child.on("error", function (e) {
        try { delete window[name]; } catch (e2) { /* ignore */ }
        resolve({ errno: -1, stdout: out, stderr: String(e) });
      });

      window[name] = child;
      try {
        k.spawn("/system/bin/sh", JSON.stringify(["-c", cmd]), "{}", name);
      } catch (e) {
        try { delete window[name]; } catch (e2) { /* ignore */ }
        throw e;
      }
    });
  }

  var VARIANTS = [
    // 官方契约：opts 是 JSON 字符串，第三参数是回调名
    { id: "ksu-official",   need: "ksu",    call: officialExec },
    { id: "ksu-spawn",      need: "ksu",    call: officialSpawn },
    // 旧分支的 spawn：三参数，直接返回子进程对象
    { id: "spawn-legacy",   need: "ksu",    call: function (k, cmd) {
        if (typeof k.spawn !== "function") throw new Error("没有 spawn 接口");
        return new Promise(function (resolve) {
          var out = "", err = "";
          var child = k.spawn("/system/bin/sh", ["-c", cmd], {});
          if (!child || !child.stdout || !child.stdout.on) throw new Error("spawn 返回异常");
          child.stdout.on("data", function (d) { out += d; });
          if (child.stderr && child.stderr.on) child.stderr.on("data", function (d) { err += d; });
          child.on("exit", function (code) { resolve({ errno: code | 0, stdout: out, stderr: err }); });
        });
      } },
    // 以下为各分支/历史版本的兜底写法
    { id: "ksu-str-cb",     need: "ksu",    call: function (k, cmd, cb) { return k.exec(cmd, "{}", cb); } },
    { id: "ksu-cb-str",     need: "ksu",    call: function (k, cmd, cb) { return k.exec(cmd, cb, "{}"); } },
    { id: "ksu-obj-cb",     need: "ksu",    call: function (k, cmd, cb) { return k.exec(cmd, {}, cb); } },
    { id: "ksu-cb",         need: "ksu",    call: function (k, cmd, cb) { return k.exec(cmd, cb); } },
    { id: "ksu-promise",    need: "ksu",    call: function (k, cmd) { return k.exec(cmd); } },
    { id: "global-cb",      need: "global", call: function (k, cmd, cb) { return window.exec(cmd, cb); } },
    { id: "global-promise", need: "global", call: function (k, cmd) { return window.exec(cmd); } }
  ];

  /* 上一次成功的形态记在 localStorage，下次直接用它，省掉整轮探测 */
  function memoGet() {
    try { return localStorage.getItem("booker.exec.variant") || ""; } catch (e) { return ""; }
  }
  function memoSet(v) {
    try { localStorage.setItem("booker.exec.variant", v); } catch (e) { /* 无痕模式忽略 */ }
  }

  function bridge(need) {
    if (need === "ksu") {
      if (!window.ksu) return null;
      var hasExec = typeof window.ksu.exec === "function";
      var hasSpawn = typeof window.ksu.spawn === "function";
      return (hasExec || hasSpawn) ? window.ksu : null;
    }
    return (typeof window.exec === "function") ? window : null;
  }

  function hasBridge() {
    return !!(bridge("ksu") || bridge("global"));
  }

  /* 把各种回调形态归一成 {errno, stdout, stderr} */
  function normalize(a, b, c) {
    var out = { errno: 0, stdout: "", stderr: "" };

    if (a && typeof a === "object") {
      out.errno = a.errno !== undefined ? a.errno : (a.code !== undefined ? a.code : 0);
      out.stdout = a.stdout || "";
      out.stderr = a.stderr || "";
      return out;
    }

    if (typeof a === "string") {
      var t = a.trim();
      if (t.charAt(0) === "{") {
        try {
          var o = JSON.parse(t);
          if (o && (o.errno !== undefined || o.stdout !== undefined || o.stderr !== undefined)) {
            out.errno = o.errno !== undefined ? o.errno : 0;
            out.stdout = o.stdout || "";
            out.stderr = o.stderr || "";
            return out;
          }
        } catch (e) { /* 不是 JSON，按普通字符串处理 */ }
      }
      if (typeof b === "string") {          // (errnoString, stdout, stderr)
        out.errno = Number(a) || 0;
        out.stdout = b;
        out.stderr = c || "";
      } else {                              // (stdout) 单参数形态
        out.stdout = a;
      }
      return out;
    }

    if (typeof a === "number") {            // (errno, stdout, stderr)
      out.errno = a;
      out.stdout = typeof b === "string" ? b : "";
      out.stderr = typeof c === "string" ? c : "";
      return out;
    }

    out.stdout = typeof b === "string" ? b : "";
    out.stderr = typeof c === "string" ? c : "";
    return out;
  }

  function callVariant(v, cmd, ms) {
    return new Promise(function (resolve) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        resolve({ errno: -1, stdout: "", stderr: "超时", variant: v.id, timedOut: true });
      }, ms);

      function finish(a, b, c) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        var r = normalize(a, b, c);
        r.variant = v.id;
        resolve(r);
      }

      var k = bridge(v.need);
      if (!k) {
        done = true;
        clearTimeout(timer);
        resolve({ errno: -1, stdout: "", stderr: "缺少 " + v.need + " 桥接", variant: v.id, error: true });
        return;
      }

      try {
        var ret = v.call(k, cmd, function (a, b, c) { finish(a, b, c); });
        if (ret && typeof ret.then === "function") {
          ret.then(function (r) { finish(r); }, function (e) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            resolve({ errno: -1, stdout: "", stderr: String(e), variant: v.id, error: true });
          });
        } else if (typeof ret === "string" || typeof ret === "number" ||
                   (ret && typeof ret === "object")) {
          // 有的分支是同步返回（字符串或 {errno,stdout,stderr}）
          finish(ret);
        }
      } catch (e) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve({ errno: -1, stdout: "", stderr: String((e && e.message) || e), variant: v.id, error: true });
      }
    });
  }

  /* 探测：并发跑一遍 echo 标记，谁先答对用谁。
     串行探测有个致命问题——冷启动第一次 exec 可能要好几秒，
     串行时第一名超时就把整轮拖死。并发 + 15 秒窗口可以容忍慢的那一次。 */
  var PROBE_MS = 15000;

  function describe(v, r) {
    if (r.error) return "异常: " + String(r.stderr || "").slice(0, 90);
    if (r.timedOut) return "超时无响应";
    return "stdout=" + JSON.stringify((r.stdout || "").slice(0, 40)) +
           " stderr=" + JSON.stringify((r.stderr || "").slice(0, 50));
  }

  function probeOnce(ms) {
    return new Promise(function (resolve) {
      var settled = false;
      var notes = {};
      var left = VARIANTS.length;

      function done(id) {
        if (settled) return;
        settled = true;
        resolve(id);
      }

      VARIANTS.forEach(function (v) {
        callVariant(v, "echo __KSU_OK__", ms).then(function (r) {
          notes[v.id] = describe(v, r);
          if (!settled && (r.stdout || "").indexOf("__KSU_OK__") >= 0) {
            done(v.id);
            return;
          }
          if (--left === 0 && !settled) {
            execInfo = VARIANTS.map(function (x) {
              return x.id + " → " + (notes[x.id] || "无结果");
            }).join("\n");
            done(null);
          }
        });
      });

      // 兜底：即使个别调用永不返回，也不能让整页卡住
      setTimeout(function () {
        if (settled) return;
        execInfo = VARIANTS.map(function (x) {
          return x.id + " → " + (notes[x.id] || "无结果");
        }).join("\n");
        done(null);
      }, ms + 2000);
    });
  }

  function ensureExec() {
    if (execReady) return Promise.resolve(execReady);
    if (probing) return probing;

    probing = (function () {
      var cached = memoGet();
      var first = cached
        ? execCmdDirect(cached, "echo __KSU_OK__", 3000).then(function (r) {
            if ((r.stdout || "").indexOf("__KSU_OK__") >= 0) return cached;
            return probeOnce(PROBE_MS);
          })
        : probeOnce(PROBE_MS);

      return first.then(function (id) {
        if (!id) { execReady = null; return null; }
        execReady = id;
        memoSet(id);
        execInfo = id;      // 身份等自检时再取，别拖慢首屏
        return id;
      });
    })();

    return probing;
  }

  function byId(id) {
    for (var i = 0; i < VARIANTS.length; i++) if (VARIANTS[i].id === id) return VARIANTS[i];
    return VARIANTS[0];
  }

  /* 直接按指定形态执行，用于试探记忆里的形态是否还有效 */
  function execCmdDirect(id, cmd, ms) {
    var v = byId(id);
    if (!bridge(v.need)) {
      return Promise.resolve({ errno: -1, stdout: "", stderr: "缺少桥接", error: true });
    }
    return callVariant(v, cmd, ms);
  }

  /* 执行一条命令；exec 不可用时返回带 noExec 标记的对象，不抛异常 */
  function execCmd(cmd, ms) {
    return ensureExec().then(function (id) {
      if (!id) {
        return { errno: -1, stdout: "", stderr: "exec 不可用", noExec: true, probe: execInfo };
      }
      return callVariant(byId(id), cmd, ms || 20000);
    });
  }

  /* ==========================================================================
   * 状态读取：优先直接取模块写好的快照文件（完全不经过 exec）
   * ====================================================================== */

  function parseKV(text) {
    var out = {};
    String(text || "").split(/\r?\n/).forEach(function (line) {
      var i = line.indexOf("=");
      if (i > 0) out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    });
    return out;
  }

  function fetchSnapshot() {
    /* KernelSU 用本地 HTTP 服务渲染 webroot，同目录文件可以直接 fetch。
       这条路不碰 exec，既不会超时也不需要权限。 */
    if (typeof fetch !== "function") return Promise.resolve(null);
    return fetch("status.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { return (j && j.STATE) ? j : null; })
      .catch(function () { return null; });
  }

  function findCtl() {
    if (ctlPath) return Promise.resolve(ctlPath);

    // 一条命令读路径 + 校验存在性，省掉一次往返（手机上每次 exec 可能要几秒）
    var probePath = 'd=$(cat /data/adb/badminton-booker/module_path 2>/dev/null); ' +
                    '[ -n "$d" ] && [ -f "$d/ctl.sh" ] && echo "$d"';
    return execCmd(probePath, 8000).then(function (r) {
      var dir = (r.stdout || "").trim().split("\n")[0];
      return dir ? dir.replace(/\/+$/, "") + "/ctl.sh" : null;
    }).then(function (p) {
      if (p) { ctlPath = p; return p; }

      var scan = "for d in /data/adb/modules/*/; do " +
                 "[ -f \"$d/ctl.sh\" ] || continue; " +
                 "echo \"$d\"; done";
      return execCmd(scan, 8000).then(function (r) {
        var list = (r.stdout || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
        for (var i = 0; i < list.length; i++) {
          if (list[i].indexOf(MODULE_ID) >= 0) {
            ctlPath = list[i].replace(/\/+$/, "") + "/ctl.sh";
            return ctlPath;
          }
        }
        if (list.length) {
          ctlPath = list[0].replace(/\/+$/, "") + "/ctl.sh";
          return ctlPath;
        }
        return null;
      });
    });
  }

  function readStatus() {
    return fetchSnapshot().then(function (snap) {
      if (snap) { snap.__src = "snapshot"; return snap; }
      return findCtl().then(function (p) {
        if (!p) return null;
        var dir = p.replace(/\/ctl\.sh$/, "");
        return execCmd("cat '" + dir + "/webroot/status.json' 2>/dev/null", 8000).then(function (r) {
          var t = (r.stdout || "").trim();
          if (t.charAt(0) === "{") {
            try {
              var o = JSON.parse(t);
              if (o && o.STATE) { o.__src = "cat"; return o; }
            } catch (e) { /* 落到下面 */ }
          }
          return execCmd("sh '" + p + "' status 2>&1", 10000).then(function (r2) {
            var kv = parseKV((r2.stdout || "") + "\n" + (r2.stderr || ""));
            if (kv.STATE) { kv.__src = "ctl"; return kv; }
            return null;
          });
        });
      });
    });
  }

  /* ==========================================================================
   * 渲染与交互
   * ====================================================================== */

  function setBusy(flag) {
    BUSY = flag;
    ["btnStart", "btnStop", "btnRestart", "btnProbe", "btnDeps", "btnSelf", "btnDiag", "btnLog", "btnRefresh"]
      .forEach(function (id) { if ($(id)) $(id).disabled = flag; });
  }

  function renderState(s) {
    var running = s.STATE === "running";
    $("dot").className = "dot " + (running ? "ok" : "err");
    $("stateText").textContent = running ? "运行中" : "已停止";
    $("vPort").textContent = s.PORT || "—";
    $("vPid").textContent = s.PID || "—";
    $("vData").textContent = "数据目录 " + (s.DATA || "—");

    // 数值先渲染完（即使命令通道还没探测完也要显示）
    if (s.PY_READY !== "yes") {
      $("vPy").textContent = "缺 Python";
    } else if (s.APP_READY !== "yes") {
      $("vPy").textContent = "程序缺失";
    } else {
      $("vPy").textContent = "就绪";
    }

    // 命令通道有问题的提示优先级最高，别被「运行时就绪」冲掉
    if (!execReady) return;

    if (s.PY_READY !== "yes") {
      showBanner("<b>没找到 Termux 的 Python。</b>先在 Termux 里执行 <code>pkg install python</code>，" +
                 "再回来点「安装依赖」。", "err");
    } else if (s.APP_READY !== "yes") {
      showBanner("<b>模块里的程序文件不完整。</b>重新安装一次模块包即可。", "err");
    } else {
      showBanner("");
    }
  }

  function refresh() {
    if (BUSY) return Promise.resolve();
    return readStatus().then(function (s) {
      if (!s) {
        $("dot").className = "dot err";
        $("stateText").textContent = "读取失败";
        showBanner(
          "<b>拿不到模块状态。</b><br>" +
          "· 快照文件 <code>webroot/status.json</code> 未取到<br>" +
          "· 命令通道：<code>" + (execInfo || "尚未探测") + "</code><br>" +
          "点「环境自检」把输出发出来即可定位。", "err");
        return;
      }
      renderState(s);
      if (execReady && s.__src === "snapshot" && s.AT) {
        var age = (Date.now() - new Date(String(s.AT).replace(/-/g, "/")).getTime()) / 1000;
        if (age > 180) {
          showBanner("<b>状态快照已 " + Math.round(age / 60) + " 分钟未更新。</b>" +
                     "开机自启可能没执行到，点「启动」或重启手机后再看。", "warn");
        }
      }
    });
  }

  function probe() {
    return findCtl().then(function (p) {
      if (!p) {
        $("vHttp").textContent = "—";
        return null;
      }
      return execCmd("sh '" + p + "' probe 2>&1", 15000).then(function (r) {
        var code = parseKV(r.stdout || "").HTTP || "";
        var el = $("vHttp");
        el.textContent = code ? ("HTTP " + code) : (r.noExec ? "—" : "未响应");
        el.style.color = code === "200" ? "var(--ok)" : (code ? "var(--err)" : "var(--muted)");
      });
    });
  }

  function runCtl(sub, label, timeoutMs) {
    if (BUSY) return;
    setBusy(true);
    toast(label + "…");
    findCtl().then(function (p) {
      if (!p) {
        setBusy(false);
        $("log").textContent = execReady
          ? ("定位不到 ctl.sh。\n\n命令通道可用（" + execInfo + "），但没找到脚本。\n" +
             "点「环境自检」看模块目录与 ctl.sh 候选路径。")
          : ("命令通道不可用，按钮无法执行。\n\n" + (execInfo || "尚未探测") +
             "\n\n状态仍能显示是因为它走的是快照文件，不经过命令通道。\n" +
             "启动/停止请临时用 Termux：\n" +
             "  su -c 'sh /data/adb/modules/*/ctl.sh start'");
        toast("命令通道不可用");
        return null;
      }
      return execCmd("sh '" + p + "' " + sub + " 2>&1", timeoutMs || 45000).then(function (r) {
        var out = ((r.stdout || "") + (r.stderr ? "\n" + r.stderr : "")).trim();
        $("log").textContent = out || (r.noExec ? ("命令通道不可用：\n" + r.probe) : "（无输出）");
        toast(r.errno === 0 ? (label + "完成") : (label + "结束，请看下方输出"));
        return refresh().then(function () { return probe(); });
      });
    }).then(function () { setBusy(false); });
  }

  function selfCheck() {
    if (BUSY) return;
    setBusy(true);
    ensureExec().then(function (id) {
      var shape = "";
      try {
        if (window.ksu) {
          var keys = [];
          for (var kk in window.ksu) keys.push(kk);
          shape = "ksu 成员: " + (keys.length ? keys.join(",") : "(不可枚举)") +
                  "  toast=" + (typeof window.ksu.toast) +
                  "  spawn=" + (typeof window.ksu.spawn) + "\n";
        } else {
          shape = "window.ksu 不存在\n";
        }
      } catch (e) { shape = "读取 ksu 成员失败: " + e + "\n"; }

      var head = "exec = " + (id || "不可用") + "\n" + (execInfo || "") + "\n" + shape +
                 new Array(30).join("-") + "\n";
      if (!id) {
        $("log").textContent = head + "命令通道不可用，无法执行自检命令。";
        setBusy(false);
        toast("命令通道不可用");
        return;
      }
      return execCmd(
        "echo ---PATH---; echo $PATH; " +
        "echo ---ID---; id 2>&1; " +
        "echo ---MODULES---; ls -l /data/adb/modules 2>&1; " +
        "echo ---MODULE_PATH---; cat /data/adb/badminton-booker/module_path 2>&1; " +
        "echo ---CTL---; ls -l /data/adb/modules/*/ctl.sh 2>&1; " +
        "echo ---WEBROOT---; ls -l /data/adb/modules/*/webroot 2>&1", 15000).then(function (r) {
        var body = ((r.stdout || "") + (r.stderr ? "\n" + r.stderr : "")).trim();
        $("log").textContent = head + (body || "（无输出）");
        setBusy(false);
        toast("自检完成");
      });
    });
  }

  function appUrl() {
    var port = $("vPort").textContent;
    if (!port || port === "—") port = "8080";
    return "http://127.0.0.1:" + port + "/";
  }

  /* 内嵌加载：不再跳去浏览器，切换页面也不会丢上下文 */
  function openFrame() {
    var url = appUrl();
    $("frameCard").style.display = "block";
    $("frameHint").textContent = "加载中… " + url;
    $("appFrame").src = url + "?_t=" + Date.now();
    try {
      $("frameCard").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { /* 老 WebView 忽略 */ }
    toast("正在加载界面");

    // 5 秒后还没出现内容，多半是系统禁止 http 内嵌，提示改用浏览器
    setTimeout(function () {
      try {
        var doc = $("appFrame").contentDocument;
        if (!doc || !doc.body || doc.body.children.length === 0) {
          $("frameHint").textContent = "内嵌加载受阻，请点「用浏览器打开」";
        } else {
          $("frameHint").textContent = "已加载 " + url;
        }
      } catch (e) {
        $("frameHint").textContent = "已加载 " + url;
      }
    }, 5000);
  }

  /* 兜底：交给系统浏览器（WebView 内跳 http 有时被拦） */
  function openBrowser() {
    var url = appUrl();
    if (BUSY) return;
    setBusy(true);
    execCmd('am start --user 0 -a android.intent.action.VIEW -d "' + url + '"', 12000).then(function (r) {
      var ok = r.errno === 0 && !/Error|Exception/i.test(r.stderr || "");
      if (!ok) {
        $("frameHint").textContent = "请手动打开：" + url;
        if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function () {});
        toast("地址已复制");
      } else {
        toast("已用浏览器打开");
      }
      setBusy(false);
    });
  }

  /* ==========================================================================
   * 启动
   * ====================================================================== */

  if (!hasBridge()) {
    $("dot").className = "dot err";
    $("stateText").textContent = "未连接到 KernelSU";
    $("vPy").textContent = "—";
    $("vData").textContent = "本页需通过 KernelSU 管理器打开";
    showBanner("<b>请在 KernelSU 管理器的模块页面里打开本页。</b><br>" +
               "普通浏览器打开时无法执行 root 命令。", "err");
    ["btnStart", "btnStop", "btnRestart", "btnProbe", "btnDeps", "btnSelf", "btnDiag", "btnLog", "btnRefresh"]
      .forEach(function (id) { if ($(id)) $(id).disabled = true; });
    $("btnOpen").onclick = openFrame;
    $("btnReloadFrame").onclick = openFrame;
    return;
  }

  $("btnStart").onclick = function () { runCtl("start", "启动", 90000); };
  $("btnStop").onclick = function () { runCtl("stop", "停止", 40000); };
  $("btnRestart").onclick = function () { runCtl("restart", "重启", 90000); };
  $("btnDeps").onclick = function () { runCtl("install-deps", "安装依赖", 240000); };
  $("btnProbe").onclick = function () { probe().then(function () { toast("健康检查已更新"); }); };
  $("btnSelf").onclick = selfCheck;
  $("btnDiag").onclick = function () { runCtl("diag", "诊断", 40000); };
  $("btnLog").onclick = function () { runCtl("log 80", "日志已更新", 20000); };
  $("btnRefresh").onclick = function () {
    if (BUSY) return;
    setBusy(true);
    refresh().then(function () { return probe(); }).then(function () {
      setBusy(false);
      toast("已刷新");
    });
  };
  $("btnOpen").onclick = openFrame;
  $("btnReloadFrame").onclick = openFrame;
  $("btnBrowser").onclick = openBrowser;

  /* 首屏：先用状态快照渲染（一次 fetch，不等命令通道），再后台探测 exec。
     某些设备的第一次 exec 要好几秒，若阻塞首屏，页面会长时间白屏。 */
  refresh();

  ensureExec().then(function () {
    if (!execReady) {
      showBanner(
        "<b>命令通道不可用。</b>已尝试 " + VARIANTS.length + " 种调用方式，均未得到响应：<br>" +
        "<code>" + (execInfo || "").replace(/\n/g, "<br>") + "</code><br>" +
        "状态仍会正常显示（走快照文件），但启动/停止按钮需要命令通道。", "err");
      $("ver").textContent = "模块 · exec 不可用";
      return null;
    }

    return findCtl().then(function (p) {
      $("ver").textContent = p
        ? p.replace("/data/adb/modules/", "").replace("/ctl.sh", "")
        : "模块 · 未定位到 ctl.sh";
      return refresh().then(probe);
    });
  }).then(function () {
    // 状态优先走快照文件，开销极小，可以刷得频一点；健康检查才偶尔做
    setInterval(function () { if (!document.hidden && !BUSY) refresh(); }, 10000);
    setInterval(function () { if (!document.hidden && !BUSY) probe(); }, 60000);
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !BUSY) refresh();
  });
})();
</script>
</body>
</html>
